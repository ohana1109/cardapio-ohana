backend:
  name: git-gateway
  branch: main
  # Adiciona mensagens de commit com [skip netlify] para evitar deploy automático
  commit_messages:
    create: 'Create {{collection}} “{{slug}}” [skip netlify]'
    update: 'Update {{collection}} “{{slug}}” [skip netlify]'
    delete: 'Delete {{collection}} “{{slug}}” [skip netlify]'
    uploadMedia: 'Upload “{{path}}” [skip netlify]'
    deleteMedia: 'Delete “{{path}}” [skip netlify]'
    openAuthoring: '{{message}} [skip netlify]'

media_folder: "assets/img/uploads"
public_folder: "/assets/img/uploads"

publish_mode: simple

collections:
  - name: "cardapio"
    label: "Cardápio"
    files:
      - name: "menu"
        label: "Itens do Cardápio"
        file: "data/menu.json"
        format: "json"
        fields:
          - label: "Itens"
            name: "items"
            widget: "list"
            summary: "{{fields.name}} — R$ {{fields.price}}"
            fields:
              - { label: "ID (único)", name: "id", widget: "string" }
              - { label: "Ativo (pausar/mostrar)", name: "active", widget: "boolean", default: true }
              - { label: "Categoria", name: "cat", widget: "select", options: ["executivos","mineira","parmegiana","alacarte","sucos","refri","cervejas","sobremesas"] }
              - { label: "Nome", name: "name", widget: "string" }
              - { label: "Descrição", name: "desc", widget: "text", required: false }
              - { label: "Preço", name: "price", widget: "number", value_type: "float", min: 0 }
              - { label: "Imagem", name: "img", widget: "image", required: false }