<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Publicar — Ohana</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'DM Sans', sans-serif; background: #F9F7F2; color: #1B1B1B; display: flex; align-items: center; justify-content: center; height: 100vh; }
    .card { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 90%; }
    h1 { margin-top: 0; color: #1A3C26; }
    p { color: #666; font-size: 14px; margin-bottom: 30px; }
    .btn { background: #1A3C26; color: #fff; border: none; padding: 16px; border-radius: 8px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn:hover { background: #2E5239; }
    .btn:disabled { opacity: 0.7; cursor: wait; }
    .status { margin-top: 20px; font-weight: bold; min-height: 20px; }
    .status.success { color: #2e7d32; }
    .status.error { color: #d32f2f; }
    .back { display: block; margin-top: 20px; color: #888; text-decoration: none; font-size: 13px; }
    .back:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Publicar Site</h1>
    <p>Você finalizou as edições? Clique abaixo para atualizar o site oficial.</p>
    <button id="btn" class="btn">PUBLICAR AGORA</button>
    <div id="status" class="status"></div>
    <a href="index.html" class="back" onclick="return checkExit()">Voltar ao Painel</a>
  </div>
  <script>
    let published = false;
    const btn = document.getElementById('btn');
    const status = document.getElementById('status');
    function checkExit() {
      if(!published && confirm("Sair sem publicar? As alterações ficarão salvas no rascunho.")) return true;
      return published;
    }
    btn.addEventListener('click', async () => {
      btn.disabled = true; btn.innerText = "Processando...";
      try {
        const res = await fetch('/.netlify/functions/publish', { method: 'POST' });
        const data = await res.json();
        if (res.ok) {
          published = true;
          status.innerText = "✅ Sucesso! Site atualizando em ~2 min.";
          status.className = 'status success';
          btn.innerText = "PUBLICADO";
        } else { throw new Error(data.error); }
      } catch (err) {
        status.innerText = "❌ Erro: " + err.message;
        status.className = 'status error';
        btn.disabled = false; btn.innerText = "TENTAR NOVAMENTE";
      }
    });
  </script>
</body>
</html>
